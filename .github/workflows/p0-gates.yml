name: p0-gates
on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks history scan (pinned v8.30.1)
        run: docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.30.1 -c "git config --global --add safe.directory /repo && gitleaks git --no-banner --redact /repo"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # The negative proof requires the planted finding (rule generic-api-key
      # on secret.txt). A scanner crash (bad flag, missing report, or any
      # exit other than 0 or 1) is a scanner failure, not evidence. A
      # completed scan whose report lacks that rule and file is an absent finding.
      # Neither may pass. A nonzero exit alone is not proof. The repo
      # allowlist is not loaded here; it applies only to the history scan.
      - name: negative proof — the planted fixture finding must be present
        run: node scripts/gates/secrets-negative.mjs

  private-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbidden patterns in the repo
        run: node scripts/gates/private-markers.mjs

  sca:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --recursive
        ./

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: install brand exporter without lifecycle scripts
        working-directory: assets/brand
        run: npm ci --ignore-scripts
      - name: brand export matches the committed svg, png, and ico files
        working-directory: assets/brand
        run: |
          npm run export
          status=$(git status --porcelain -- svg png social favicon.ico)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - run: node scripts/gates/license-audit.mjs
      - run: node scripts/gates/kernel-purity.mjs
      # Identity patterns stay in commit-policy.yml. This pull_request job
      # must not receive that secret, because it checks out and runs the
      # merge commit.
      - run: node scripts/gates/gate-health.test.mjs
      # Approval artifacts (plan §8 / T13). Required when the scoped diff is
      # non-empty, signed by the key at the merge-base — on push, the
      # pre-push commit github.event.before — never the head key. A missing
      # key fails closed. While docs/ai/model-routing.md waives the signed
      # artifact, a missing artifact does not fail this step; a present
      # artifact is still verified.
      - name: verify gate-config approval artifacts
        env:
          APPROVAL_EVENT: ${{ github.event_name }}
          APPROVAL_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          set -eu
          case "$APPROVAL_EVENT" in
            push|pull_request) ;;
            *)
              echo "verify-approval: event is not push or pull_request — FAIL CLOSED" >&2
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$APPROVAL_BASE" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "verify-approval: base revision is not a commit sha — FAIL CLOSED" >&2
            exit 1
          fi
          if [ "$APPROVAL_EVENT" = "push" ]; then
            base="$APPROVAL_BASE"
          else
            base=$(git merge-base "$APPROVAL_BASE" HEAD)
          fi
          node scripts/gates/verify-approval.mjs --base "$base" --head HEAD --event "$APPROVAL_EVENT"
