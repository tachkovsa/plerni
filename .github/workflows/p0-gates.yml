name: p0-gates
on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks history scan (pinned v8.30.1)
        run: docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.30.1 -c "git config --global --add safe.directory /repo && gitleaks git --no-banner --redact /repo"
      - name: negative proof — the synthetic fixture secret MUST be detected
        run: |
          set +e
          docker run --rm -v "$PWD/scripts/gates/fixtures/gitleaks:/scan" zricethezav/gitleaks:v8.30.1 dir --no-banner /scan
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "gitleaks failed to detect the synthetic fixture secret — the secrets gate is NOT proven fail-closed"
            exit 1
          fi
          echo "secrets negative proof OK (gitleaks exit $code)"

  private-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbidden patterns in the repo
        run: node scripts/gates/private-markers.mjs

  sca:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --recursive
        ./

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: install brand exporter without lifecycle scripts
        working-directory: assets/brand
        run: npm ci --ignore-scripts
      - run: node scripts/gates/license-audit.mjs
      - run: node scripts/gates/kernel-purity.mjs
      - run: node scripts/gates/commit-policy.mjs --base "${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'dev') }}"
      - run: node scripts/gates/gate-health.test.mjs
