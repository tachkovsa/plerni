# Dev harness — PG 18 + PgBouncer (transaction mode). P0 scope only: no Valkey/S3 (no P0 consumer).
# Passwords arrive via the environment ONLY (render-secrets.mjs generates pgbouncer/userlist.txt).
services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD unset}
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Healthcheck auth only; the console user is read-only (stats_users).
      PGPASSWORD: ${PLERNI_ADMIN_PASSWORD:?PLERNI_ADMIN_PASSWORD unset}
    volumes:
      - ./pgbouncer:/etc/pgbouncer:ro
    ports:
      - "54321:6432"
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -p 6432 -U plerni_admin_ro pgbouncer -c 'SHOW POOLS' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
