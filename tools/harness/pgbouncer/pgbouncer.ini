# PgBouncer configuration for the Plerni dev harness.
# pool_mode=transaction is the production pooling mode (spec §5); every P0 spike runs through it.
[databases]
; The only mapped database: app traffic lands here; the admin console is dbname "pgbouncer".
plerni = host=postgres port=5432 dbname=plerni

[pgbouncer]
; 0.0.0.0 inside the container; the host publishes loopback-only (see compose ports).
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
; A4 measured unnamed extended-protocol overhead above 20% on a direct connection.
; A4b therefore tracks protocol-level named statements (plan §3.1). 0 disables
; that tracking and makes the branch unrunnable. 200 is PgBouncer 1.26.0's
; documented default (doc/config.md, max_prepared_statements) and sits above the
; distinct statements in the A1–A3 pooled rerun. Unnamed traffic is unchanged:
; A4 still requires empty client statement names. This cache does not speed
; those unnamed statements up.
max_prepared_statements = 200
auth_type = scram-sha-256
; Generated at reset time from env by render-secrets.mjs (gitignored; mode 640
; group 70, or mode 600 in a 0700 directory when that group cannot be set).
auth_file = /etc/pgbouncer/userlist.txt
; Read-only console: stats_users get SHOW *; admin_users would also get PAUSE/SHUTDOWN.
stats_users = plerni_admin_ro
; Pinned: the IPC spike's saturated-pool case (T5c) keys on this size.
default_pool_size = 10
