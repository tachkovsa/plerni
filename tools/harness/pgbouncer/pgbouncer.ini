# PgBouncer configuration for the Plerni dev harness.
# pool_mode=transaction is the production pooling mode (spec §5); every P0 spike runs through it.
[databases]
plerni = host=postgres port=5432 dbname=plerni

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
; Named prepared statements are OFF until Spike A measures the alternative (plan §3.1 A4):
; this setting only governs named statements — it is not a fallback for unnamed traffic.
max_prepared_statements = 0
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Read-only console: stats_users get SHOW *, admin_users would also get PAUSE/SHUTDOWN.
stats_users = plerni_admin_ro
; Pinned: the IPC spike's saturated-pool case (T5c) keys on this size.
default_pool_size = 10
